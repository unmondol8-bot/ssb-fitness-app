name: Taiyari shuru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Repair and Generate Full Android Project Structure
        run: |
          cp -r lib /tmp/saved_lib
          cp pubspec.yaml /tmp/saved_pubspec.yaml
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            mkdir -p /tmp/saved_android
            cp android/app/src/main/AndroidManifest.xml /tmp/saved_android/AndroidManifest.xml
          fi

          flutter create . --platforms=android --org=com.example --project-name=ssb_cadet_app

          rm -rf lib
          cp -r /tmp/saved_lib lib
          cp /tmp/saved_pubspec.yaml pubspec.yaml

          if [ -f /tmp/saved_android/AndroidManifest.xml ]; then
            mkdir -p android/app/src/main
            cp /tmp/saved_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssb-cadet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
