name: Taiyari shuru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean Android Platform & Force SDK 34
        run: |
          # 1. Generate full official Android gradle engine in a fresh directory
          cd ..
          flutter create --org com.example --project-name ssb_cadet_app fresh_app
          
          # 2. Copy the entire generated Android scaffolding into your workspace
          cp -rn fresh_app/android $GITHUB_WORKSPACE/
          
          # 3. Enter your project workspace
          cd $GITHUB_WORKSPACE
          
          # 4. Patch Android Gradle settings to support notifications & modern Android APIs
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          
          # 5. Fetch dependencies
          flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssb-cadet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
